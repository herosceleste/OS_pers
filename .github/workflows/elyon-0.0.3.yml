name: Elyon Kernel 0.0.3 CI

on:
  push:
    branches:
      - elyon-0.0.3
      - main
    paths:
      - "Elyon-Kernel-0.0.3/**"
      - ".github/workflows/elyon-0.0.3.yml"
  pull_request:
    paths:
      - "Elyon-Kernel-0.0.3/**"
      - ".github/workflows/elyon-0.0.3.yml"

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso dosfstools mtools

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup target add x86_64-unknown-uefi --toolchain 1.99.1
          rustup target add x86_64-unknown-none --toolchain 1.99.1
          rustc +1.99.1 --version

      - name: Format check
        working-directory: Elyon-Kernel-0.0.3
        run: cargo +1.99.1 fmt --all -- --check

      - name: Build loader and kernel
        working-directory: Elyon-Kernel-0.0.3
        run: bash scripts/build.sh

      - name: QEMU OVMF smoke test
        working-directory: Elyon-Kernel-0.0.3
        run: bash scripts/smoke-test.sh

      - name: ACPI RSDP XSDT MADT test
        working-directory: Elyon-Kernel-0.0.3
        run: bash scripts/test-acpi-qemu.sh

      - name: Local APIC BSP test
        working-directory: Elyon-Kernel-0.0.3
        run: bash scripts/test-lapic-qemu.sh

      - name: Per-CPU state test
        working-directory: Elyon-Kernel-0.0.3
        run: bash scripts/test-percpu-qemu.sh

      - name: IOAPIC routing test
        working-directory: Elyon-Kernel-0.0.3
        run: bash scripts/test-ioapic-qemu.sh

      - name: Local APIC timer test
        working-directory: Elyon-Kernel-0.0.3
        run: bash scripts/test-timer-qemu.sh

      - name: QEMU invalid-opcode regression test
        working-directory: Elyon-Kernel-0.0.3
        run: bash scripts/test-ud-qemu.sh

      - name: QEMU double-fault IST regression test
        working-directory: Elyon-Kernel-0.0.3
        run: bash scripts/test-df-qemu.sh
