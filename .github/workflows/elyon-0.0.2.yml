name: Elyon Kernel 0.0.2 CI

on:
  push:
    branches:
      - elyon-0.0.2
      - main
    paths:
      - "Elyon-Kernel-0.0.2/**"
      - ".github/workflows/elyon-0.0.2.yml"
  pull_request:
    paths:
      - "Elyon-Kernel-0.0.2/**"
      - ".github/workflows/elyon-0.0.2.yml"

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso dosfstools mtools

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup target add x86_64-unknown-uefi --toolchain 1.99.1
          rustup target add x86_64-unknown-none --toolchain 1.99.1
          rustc +1.99.1 --version

      - name: Format check
        working-directory: Elyon-Kernel-0.0.2
        run: cargo +1.99.1 fmt --all -- --check

      - name: Build loader and kernel
        working-directory: Elyon-Kernel-0.0.2
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: QEMU OVMF smoke test
        working-directory: Elyon-Kernel-0.0.2
        run: ./scripts/smoke-test.sh

      - name: QEMU invalid-opcode exception test
        working-directory: Elyon-Kernel-0.0.2
        run: bash scripts/test-ud-qemu.sh

      - name: QEMU double-fault IST test
        working-directory: Elyon-Kernel-0.0.2
        run: bash scripts/test-df-qemu.sh
