name: Elyon Kernel 0.0.4 CI

on:
  push:
    branches:
      - elyon-0.0.4
    paths:
      - "Elyon-Kernel-0.0.4/**"
      - ".github/workflows/elyon-0.0.4.yml"
  pull_request:
    paths:
      - "Elyon-Kernel-0.0.4/**"
      - ".github/workflows/elyon-0.0.4.yml"

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso dosfstools mtools

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup target add x86_64-unknown-uefi --toolchain 1.99.1
          rustup target add x86_64-unknown-none --toolchain 1.99.1
          rustc +1.99.1 --version

      - name: Format check
        working-directory: Elyon-Kernel-0.0.4
        run: cargo +1.99.1 fmt --all -- --check

      - name: Host unit tests (elyon-core, elyon-abi)
        working-directory: Elyon-Kernel-0.0.4
        run: cargo +1.99.1 test --locked -p elyon-core -p elyon-abi

      - name: Clippy (deny warnings)
        working-directory: Elyon-Kernel-0.0.4
        run: |
          cargo +1.99.1 clippy --locked -p elyon-core -p elyon-abi --all-targets -- -D warnings
          cargo +1.99.1 clippy --locked -p elyon-kernel --target x86_64-unknown-none -- -D warnings
          cargo +1.99.1 clippy --locked -p elyon-loader --target x86_64-unknown-uefi -- -D warnings

      - name: Undocumented unsafe report (non-blocking)
        working-directory: Elyon-Kernel-0.0.4
        continue-on-error: true
        run: |
          for spec in "elyon-kernel x86_64-unknown-none" "elyon-loader x86_64-unknown-uefi"; do
            set -- $spec
            count=$(cargo +1.99.1 clippy --locked -p "$1" --target "$2" -- -W clippy::undocumented_unsafe_blocks 2>&1 \
              | grep -c "unsafe block missing a safety comment" || true)
            echo "::notice title=undocumented unsafe::$1 $count"
          done

      - name: Build loader and kernel
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/build.sh

      - name: QEMU OVMF smoke test
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/smoke-test.sh

      - name: ACPI regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-acpi-qemu.sh

      - name: Local APIC regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-lapic-qemu.sh

      - name: Per-CPU regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-percpu-qemu.sh

      - name: INIT-SIPI one-AP regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-smp-one-ap-qemu.sh

      - name: All-AP SMP regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-smp-all-aps-qemu.sh

      - name: SMP stability regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-smp-stability-qemu.sh

      - name: Context-switch regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-context-switch-qemu.sh

      - name: K004-01 task model test
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-task-model-qemu.sh

      - name: IOAPIC regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-ioapic-qemu.sh

      - name: Local APIC timer regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-timer-qemu.sh

      - name: K003 baseline regression gate
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-release-gate-qemu.sh

      - name: Invalid-opcode fail-closed regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-ud-qemu.sh

      - name: Double-fault IST regression
        working-directory: Elyon-Kernel-0.0.4
        run: bash scripts/test-df-qemu.sh
